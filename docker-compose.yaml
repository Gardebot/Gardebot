networks:
  internal:
    driver: bridge

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_PORT: 3000
      TZ: Europe/Zurich
      WHATSAPP_HOOK_URL: http://gardebot:5000/webhook
      WAHA_START_SESSION: default
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_EVENTS: message,poll.vote,session.status
    env_file:
      - credentials_waha.env
    ports:
      - "3000:3000"
    networks:
      - internal

  gardebot:
    build:
      context: .
    image: ghcr.io/gardebot/gardebot:latest   # build will override if local
    container_name: gardebot
    restart: unless-stopped
    env_file:
      - credentials.env
    depends_on:
      - waha
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_DEBUG: "false"
      LOG_LEVEL: INFO
      WAHA_BASE_URL: http://waha:3000
      WAHA_SESSION: default
    command: ["doppler", "run", "--", "python", "-m", "gardebot.app"]
    networks:
      - internal
