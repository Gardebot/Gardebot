version: "3.9"

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_PORT: 3000
      TZ: Europe/Zurich
      WHATSAPP_HOOK_URL: http://gardebot:5000/webhook
      WAHA_START_SESSION: default
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_EVENTS: message
    ports:
      - "3000:3000"
    volumes:
      - ./waha-data:/app/data

  gardebot:
    image: ghcr.io/gardebot/gardebot:latest
    build:
      context: .
      labels:
        org.opencontainers.image.source: https://github.com/Gardebot/Gardebot
        org.opencontainers.image.title: Gardebot
        org.opencontainers.image.description: WhatsApp automation bot
    container_name: gardebot
    restart: unless-stopped
    depends_on:
      - waha
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_DEBUG: "true"
      LOG_LEVEL: INFO
      WAHA_BASE_URL: http://waha:3000
      WAHA_SESSION: default
    ports:
      - "5000:5000"
    command: ["python", "-m", "gardebot.app"]
