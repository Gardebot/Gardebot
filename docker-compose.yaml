version: "3.9"

networks:
  internal:
    driver: bridge

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_PORT: 3000
      TZ: Europe/Zurich
      WHATSAPP_HOOK_URL: http://gardebot:5000/webhook
      WAHA_START_SESSION: default
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_EVENTS: message
    ports:
      - "3000:3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  gardebot:
    image: ghcr.io/gardebot/gardebot:latest
    build:
      context: .
    container_name: gardebot
    restart: unless-stopped
    depends_on:
      - waha
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_DEBUG: "false"
      LOG_LEVEL: INFO
      WAHA_BASE_URL: http://waha:3000
      WAHA_SESSION: default
    networks:
      - internal
    command: ["python", "-m", "gardebot.app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
