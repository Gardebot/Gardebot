version: "3.9"

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB              # Other options: WEBJS, GOWS
      WAHA_API_PORT: 3000
      WAHA_WEBHOOK_URL: http://gardebot:5000/webhook
      WAHA_START_SESSION: default
      WAHA_LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - ./waha-data:/app/data   # persist session so you don't rescan (if engine supports it)

  gardebot:
    build: .
    container_name: gardebot
    restart: unless-stopped
    depends_on:
      - waha
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_DEBUG: "true"
      WAHA_BASE_URL: http://localhost:3000
      WAHA_SESSION: default
    ports:
      - "5000:5000"
    command: ["python", "-m", "gardebot.app"]
