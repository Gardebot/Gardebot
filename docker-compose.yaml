networks:
  internal:
    driver: bridge

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_PORT: 3000
      TZ: Europe/Zurich
      WHATSAPP_HOOK_URL: http://gardebot:5000/webhook
      WAHA_START_SESSION: default
      WAHA_LOG_LEVEL: info
      WHATSAPP_HOOK_EVENTS: message
    ports:
      - "3000:3000"
    networks:
      - internal

  gardebot:
    image: ghcr.io/gardebot/gardebot:latest
    build:
      context: .
    container_name: gardebot
    restart: unless-stopped
    depends_on:
      - waha
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_DEBUG: "false"
      LOG_LEVEL: INFO
      WAHA_BASE_URL: http://waha:3000
      WAHA_SESSION: default
      TEST_USER: /run/secrets/username
      TEST_PWD: /run/secrets/password
    networks:
      - internal
    volumes:
      - secrets:/run/secrets
    command: ["python", "-m", "gardebot.app"]

  secrets:
    image: hashicorp/vault
    volumes:
      - secrets:/secrets
    command: ["vault", "server", "-dev", "-dev-root-token-id=myroot"]
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK

volumes:
  secrets:
